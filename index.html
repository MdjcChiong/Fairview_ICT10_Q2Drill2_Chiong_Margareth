<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

<title>Club Member Manager</title>


<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    font-family: "Courier New", monospace;
    background: linear-gradient(135deg, #fff9d9, #e1fbf4, #fff6cf);
    color: #2b1a0b;
}

.container {
    max-width: 800px;
    margin: 0 auto;
    padding: 35px;
    background: linear-gradient(135deg, #fffde7, #e1faf4, #fff9d6);
    border: 8px solid #713500;
    border-radius: 25px;
    box-shadow: 0 8px 25px #71350025;
}

h1 {
    font-size: 30px;
    font-weight: normal;
    margin: 0 0 25px;
    overflow-wrap: anywhere;
    color: #2b1a0b;
}

input {
    display: block;
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #d9c8b5;
    border-radius: 13px;
    font-family: inherit;
    font-size: 15px;
    background-color: #ffffff;
    color: #2b1a0b;
    box-shadow: 0 7px 10px #00000025;
}

button {
    padding: 10px 15px;
    background: #713500;
    color: white;
    border: 2px solid #713500;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    background-color: #542600;
}

#result {
    margin-top: 25px;
    padding: 20px 15px;
    background-color: #e1faf4;
    border: 4px solid #713500;
    border-radius: 12px;
    line-height: 1.8;
    overflow-wrap: anywhere;
    color: #2b1a0b;
}

#result h2 {
    font-size: 15px;
    font-weight: normal;
    margin: 0 0 5px;
    color: #713500;
}

@media (max-width: 600px) {
    .container {
        padding: 20px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>ADD NEW CLUB MEMBER:</h1>

   
    <input type="text" id="first_name" placeholder="First Name">
    <input type="text" id="last_name" placeholder="Last Name">

   
    <button py-click="add_member">Submit</button>

  
    <div id="result"></div>

</div>

<script type="py" src="main.py"></script>

</body>
</html>
